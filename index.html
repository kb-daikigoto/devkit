<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DEVKIT — エンジニアの道具箱</title>
<style>
  :root{
    --bg:#0b0e14; --bg2:#0e121b; --panel:#121724; --ink:#e6ebf4; --dim:#8492ad;
    --line:#1e2536; --line2:#2a3349; --accent:#6ad0ff; --accent2:#b388ff;
    --good:#5ce6a8; --bad:#ff7a93; --warn:#ffcf6a; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;overflow:hidden}
  ::selection{background:rgba(106,208,255,.28)}
  /* scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#222b3e;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#2e3a52}

  /* ---------------- sidebar ---------------- */
  #side{width:230px;flex:0 0 230px;background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
  .logo{padding:18px 18px 14px;display:flex;align-items:center;gap:10px}
  .logo b{font-size:18px;letter-spacing:.18em;background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good)}
  .seek{margin:0 14px 10px;display:flex;align-items:center;gap:8px;padding:8px 11px;background:#0c1019;
    border:1px solid var(--line);border-radius:10px;color:var(--dim);font:12px/1 var(--mono);cursor:text}
  .seek kbd{margin-left:auto;background:#1a2233;border:1px solid var(--line2);border-radius:5px;
    padding:2px 6px;font:11px/1 var(--mono);color:var(--dim)}
  nav{flex:1;overflow:auto;padding:4px 10px 14px}
  .nav-i{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--dim);
    margin-bottom:2px;transition:.12s;border:1px solid transparent}
  .nav-i:hover{background:#141a28;color:var(--ink)}
  .nav-i.on{background:linear-gradient(90deg,rgba(106,208,255,.14),rgba(179,136,255,.1));
    color:var(--ink);border-color:rgba(106,208,255,.22)}
  .nav-i .ic{width:20px;text-align:center;font-size:15px}
  .nav-i .nm{flex:1;font-size:13px;font-weight:500}
  .nav-i .kb{font:10px/1 var(--mono);color:var(--dim);opacity:.7}
  .foot{padding:12px 16px;border-top:1px solid var(--line);font:11px/1.5 var(--mono);color:var(--dim)}
  .foot a{color:var(--accent);text-decoration:none}

  /* ---------------- main ---------------- */
  main{flex:1;height:100%;overflow:auto;display:flex;flex-direction:column}
  .head{padding:22px 30px 6px;display:flex;align-items:flex-end;gap:14px}
  .head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em}
  .head p{margin:0 0 2px;color:var(--dim);font-size:13px}
  .wrap{padding:18px 30px 40px;flex:1}
  .panel{display:none;animation:fade .2s ease}
  .panel.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

  /* shared field bits */
  label.fl{display:block;font:11px/1 var(--mono);color:var(--dim);letter-spacing:.08em;
    text-transform:uppercase;margin:0 0 7px}
  textarea,input[type=text],input[type=password],select{width:100%;background:#0c1019;color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:12px 13px;font:13px/1.6 var(--mono);
    outline:none;resize:vertical;transition:border .15s}
  textarea:focus,input:focus,select:focus{border-color:rgba(106,208,255,.5)}
  textarea{min-height:140px;white-space:pre;overflow:auto}
  select{cursor:pointer;height:42px}
  .row{display:flex;gap:16px}.row>*{flex:1;min-width:0}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
  button.act{padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:#151c2b;
    color:var(--ink);font:600 12px/1 inherit;cursor:pointer;transition:.13s}
  button.act:hover{background:#1c2740;border-color:rgba(106,208,255,.4);transform:translateY(-1px)}
  button.act.pri{background:linear-gradient(90deg,rgba(106,208,255,.85),rgba(179,136,255,.85));
    color:#08101c;border:0}
  button.act.pri:hover{filter:brightness(1.08)}
  button.gho{background:transparent;border-color:var(--line)}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);
    cursor:pointer;font:12px/1 var(--mono);color:var(--dim);user-select:none}
  .chip.on{background:rgba(106,208,255,.16);border-color:rgba(106,208,255,.4);color:var(--ink)}
  .out{margin-top:14px;background:#0c1019;border:1px solid var(--line);border-radius:10px;
    padding:13px;font:13px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;min-height:46px;overflow:auto}
  .msg{font:12px/1.4 var(--mono);margin:8px 0 0}
  .msg.ok{color:var(--good)} .msg.err{color:var(--bad)} .msg.muted{color:var(--dim)}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font:11px/1.6 var(--mono);
    border:1px solid var(--line2);color:var(--dim);margin-right:6px}
  .pill.g{color:var(--good);border-color:rgba(92,230,168,.4)}
  .pill.b{color:var(--bad);border-color:rgba(255,122,147,.4)}

  /* JSON tree */
  .tree{font:13px/1.65 var(--mono)}
  .tk{color:var(--accent)} .ts{color:var(--good)} .tn{color:var(--warn)} .tb{color:var(--accent2)}
  .tnull{color:var(--dim)} .tog{cursor:pointer;color:var(--dim);user-select:none}
  .tree .ind{padding-left:18px;border-left:1px solid var(--line)}
  .collapsed>.ind{display:none}
  .collapsed>.tog::after{content:" …}"}

  /* tables */
  table{width:100%;border-collapse:collapse;font:12.5px/1.5 var(--mono);margin-top:12px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  td .k{color:var(--accent)}

  /* regex highlight */
  mark{background:rgba(255,207,106,.28);color:var(--warn);border-radius:3px;padding:0 1px}
  mark.alt{background:rgba(106,208,255,.22);color:var(--accent)}

  /* diff */
  .diff{font:12.5px/1.55 var(--mono);background:#0c1019;border:1px solid var(--line);border-radius:10px;
    overflow:auto;max-height:60vh}
  .dl{display:flex;white-space:pre}
  .dl .gut{flex:0 0 46px;text-align:right;padding:1px 9px;color:var(--dim);
    user-select:none;border-right:1px solid var(--line)}
  .dl .tx{padding:1px 12px;flex:1}
  .dl.add{background:rgba(92,230,168,.09)} .dl.add .tx{color:var(--good)}
  .dl.del{background:rgba(255,122,147,.09)} .dl.del .tx{color:var(--bad)}
  .dl.add .tx::before{content:"+ "} .dl.del .tx::before{content:"- "} .dl.ctx .tx::before{content:"  "}

  /* hash grid */
  .kv{display:grid;grid-template-columns:120px 1fr;gap:1px;background:var(--line);border:1px solid var(--line);
    border-radius:10px;overflow:hidden;margin-top:12px}
  .kv>div{background:#0c1019;padding:10px 13px;font:12.5px/1.5 var(--mono)}
  .kv .key{color:var(--dim)} .kv .val{word-break:break-all;display:flex;justify-content:space-between;gap:10px}
  .copy{cursor:pointer;color:var(--dim);font-size:11px;opacity:0;transition:.12s}
  .kv .val:hover .copy,.cardv:hover .copy{opacity:1}
  .copy:hover{color:var(--accent)}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
  .card{background:#0c1019;border:1px solid var(--line);border-radius:10px;padding:13px 14px}
  .card .ct{font:10px/1 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
  .card .cardv{font:600 16px/1.4 var(--mono);word-break:break-all;display:flex;justify-content:space-between;gap:8px}

  /* command palette */
  #pal{position:fixed;inset:0;background:rgba(5,7,12,.6);backdrop-filter:blur(4px);display:none;
    align-items:flex-start;justify-content:center;z-index:50}
  #pal.on{display:flex}
  .palbox{margin-top:12vh;width:min(560px,92vw);background:var(--panel);border:1px solid var(--line2);
    border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.6);overflow:hidden}
  .palbox input{border:0;border-bottom:1px solid var(--line);border-radius:0;font-size:16px;padding:16px 18px}
  .palist{max-height:50vh;overflow:auto;padding:8px}
  .pi{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:9px;cursor:pointer;color:var(--dim)}
  .pi .ic{width:22px;text-align:center;font-size:16px}
  .pi .nm{flex:1;color:var(--ink)} .pi .sub{font:11px/1 var(--mono);color:var(--dim)}
  .pi.sel{background:linear-gradient(90deg,rgba(106,208,255,.16),rgba(179,136,255,.12))}

  /* toast */
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#10243a;border:1px solid rgba(106,208,255,.4);color:var(--ink);padding:10px 18px;
    border-radius:10px;font:13px/1 var(--mono);opacity:0;transition:.25s;pointer-events:none;z-index:60}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<aside id="side">
  <div class="logo"><span class="dot"></span><b>DEVKIT</b></div>
  <div class="seek" id="seek">⌘ ツール検索 / コマンド <kbd>⌘K</kbd></div>
  <nav id="nav"></nav>
  <div class="foot">100% オフライン・ローカル保存<br>データは外部に送信されません</div>
</aside>

<main>
  <div class="head"><h1 id="h-title">—</h1><p id="h-desc"></p></div>
  <div class="wrap" id="wrap"><!-- panels injected --></div>
</main>

<div id="pal"><div class="palbox">
  <input id="pal-in" type="text" placeholder="ツール・コマンドを検索…  (例: json, uuid, 現在時刻)" autocomplete="off">
  <div class="palist" id="pal-list"></div>
</div></div>

<div id="toast"></div>

<script>
"use strict";
/* ===================================================================
   DEVKIT — fully offline engineer's toolbox. Single file, no deps.
   Each tool is a module {id,name,icon,desc,keywords,html,init}.
   =================================================================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (h)=>{ const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS = { get:(k,d)=>{try{const v=localStorage.getItem('devkit:'+k);return v==null?d:v;}catch{return d;}},
             set:(k,v)=>{try{localStorage.setItem('devkit:'+k,v);}catch{}} };

let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1400); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast('コピーしました'); }
  catch{ toast('コピーできませんでした'); } }

/* ------- shared crypto/encoding helpers ------- */
const enc=new TextEncoder(), dec=new TextDecoder();
function b64encode(str){ const b=enc.encode(str); let s=''; for(const x of b) s+=String.fromCharCode(x); return btoa(s); }
function b64decode(b64){ const bin=atob(b64.replace(/\s+/g,'')); const u=Uint8Array.from(bin,c=>c.charCodeAt(0)); return dec.decode(u); }
function b64urlDecode(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; return b64decode(s); }
async function sha(algo,text){ const buf=await crypto.subtle.digest(algo,enc.encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function uuidv4(){ if(crypto.randomUUID) return crypto.randomUUID();
  const b=crypto.getRandomValues(new Uint8Array(16)); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0'));
  return `${h.slice(0,4).join('')}-${h.slice(4,6).join('')}-${h.slice(6,8).join('')}-${h.slice(8,10).join('')}-${h.slice(10,16).join('')}`; }

/* =================================================================== */
/*  TOOL: JSON                                                          */
/* =================================================================== */
const T_JSON={ id:'json', name:'JSON', icon:'{}', desc:'整形・最小化・パス検索・折りたたみツリー',
  keywords:'json format minify pretty tree jq query 整形 最小化',
  html:`
    <label class="fl">入力 JSON</label>
    <textarea id="j-in" spellcheck="false" placeholder='{"hello":"world","items":[1,2,3]}'></textarea>
    <div class="bar">
      <button class="act pri" id="j-fmt">整形 (2sp)</button>
      <button class="act" id="j-fmt4">整形 (4sp)</button>
      <button class="act" id="j-min">最小化</button>
      <button class="act" id="j-sort">キー名でソート</button>
      <button class="act gho" id="j-copy">コピー</button>
      <span style="flex:1"></span>
      <input type="text" id="j-path" placeholder="パス検索: items[0]  /  user.name" style="max-width:260px">
    </div>
    <div id="j-msg" class="msg muted"></div>
    <div class="out tree" id="j-out"></div>`,
  init(){
    const inp=$('#j-in'), out=$('#j-out'), msg=$('#j-msg'), path=$('#j-path');
    inp.value=LS.get('json:in','');
    const parse=()=>{ try{ return [JSON.parse(inp.value), null]; }catch(e){ return [null,e.message]; } };
    const setOut=(obj)=>{ out.innerHTML=''; out.appendChild(renderTree(obj)); };
    const run=()=>{ LS.set('json:in',inp.value);
      if(!inp.value.trim()){ out.innerHTML=''; msg.className='msg muted'; msg.textContent=''; return; }
      const [obj,err]=parse();
      if(err){ msg.className='msg err'; msg.textContent='✗ '+err; out.innerHTML=''; return; }
      const s=JSON.stringify(obj); msg.className='msg ok';
      msg.textContent=`✓ 妥当な JSON · ${countKeys(obj)} キー · 深さ ${depth(obj)} · ${s.length.toLocaleString()} 文字`;
      setOut(obj);
    };
    const reformat=(sp)=>{ const [obj,err]=parse(); if(err){msg.className='msg err';msg.textContent='✗ '+err;return;}
      inp.value = sp===0? JSON.stringify(obj): JSON.stringify(obj,null,sp); run(); };
    inp.addEventListener('input',run);
    $('#j-fmt').onclick=()=>reformat(2);
    $('#j-fmt4').onclick=()=>reformat(4);
    $('#j-min').onclick=()=>reformat(0);
    $('#j-sort').onclick=()=>{ const [obj,err]=parse(); if(err){msg.className='msg err';msg.textContent='✗ '+err;return;}
      inp.value=JSON.stringify(sortKeys(obj),null,2); run(); };
    $('#j-copy').onclick=()=>copy(inp.value);
    path.addEventListener('input',()=>{ const [obj,err]=parse();
      if(err||!path.value.trim()){ run(); return; }
      try{ const v=queryPath(obj,path.value.trim());
        msg.className='msg ok'; msg.textContent='→ '+path.value.trim();
        out.innerHTML=''; out.appendChild(renderTree(v));
      }catch(e){ msg.className='msg err'; msg.textContent='✗ '+e.message; } });
    run();
  }
};
function sortKeys(o){ if(Array.isArray(o)) return o.map(sortKeys);
  if(o&&typeof o==='object'){ const r={}; Object.keys(o).sort().forEach(k=>r[k]=sortKeys(o[k])); return r; } return o; }
function countKeys(o){ let n=0; (function w(x){ if(Array.isArray(x))x.forEach(w);
  else if(x&&typeof x==='object'){ for(const k in x){n++;w(x[k]);} } })(o); return n; }
function depth(o){ if(Array.isArray(o)) return 1+(o.length?Math.max(...o.map(depth)):0);
  if(o&&typeof o==='object'){ const v=Object.values(o); return 1+(v.length?Math.max(...v.map(depth)):0); } return 0; }
function queryPath(obj,p){ const toks=p.replace(/\[(\d+)\]/g,'.$1').replace(/^\./,'').split('.').filter(Boolean);
  let cur=obj; for(const t of toks){ if(cur==null) throw new Error('null に対して "'+t+'" を参照できません');
    cur=cur[t]; if(cur===undefined) throw new Error('"'+t+'" が見つかりません'); } return cur; }
function renderTree(v){
  const node=el('<div></div>');
  const type=v===null?'null':Array.isArray(v)?'array':typeof v;
  if(type==='object'||type==='array'){
    const open=type==='array'?'[':'{', close=type==='array'?']':'}';
    const keys=type==='array'?v.map((_,i)=>i):Object.keys(v);
    const head=el(`<div><span class="tog">▾ </span><span class="tn">${open}</span> <span class="tnull">${keys.length} 項目</span></div>`);
    node.appendChild(head);
    const ind=el('<div class="ind"></div>');
    keys.forEach((k,i)=>{ const line=el('<div></div>');
      const kk=type==='array'?`<span class="tnull">${k}:</span> `:`<span class="tk">"${esc(k)}"</span>: `;
      line.innerHTML=kk; line.appendChild(renderTree(v[k]));
      if(i<keys.length-1) line.appendChild(el('<span class="tnull">,</span>'));
      ind.appendChild(line); });
    node.appendChild(ind);
    node.appendChild(el(`<div><span class="tn">${close}</span></div>`));
    head.querySelector('.tog').onclick=()=>node.classList.toggle('collapsed');
    head.style.display='inline'; // keep brace inline-ish
    return node;
  }
  let cls='tnull',disp=String(v);
  if(type==='string'){cls='ts';disp='"'+esc(v)+'"';}
  else if(type==='number'){cls='tn';}
  else if(type==='boolean'){cls='tb';}
  else if(type==='null'){cls='tnull';disp='null';}
  node.innerHTML=`<span class="${cls}">${disp}</span>`; node.style.display='inline';
  return node;
}

/* =================================================================== */
/*  TOOL: JWT                                                           */
/* =================================================================== */
const T_JWT={ id:'jwt', name:'JWT', icon:'🔑', desc:'デコード・クレーム解説・HS署名検証',
  keywords:'jwt token jose claim verify hmac signature 検証 トークン',
  html:`
    <label class="fl">JWT トークン</label>
    <textarea id="w-in" spellcheck="false" style="min-height:90px" placeholder="eyJhbGci...（貼り付け）"></textarea>
    <div class="bar">
      <input type="text" id="w-secret" placeholder="HS256 秘密鍵（署名検証する場合）" style="max-width:340px">
      <button class="act" id="w-verify">署名を検証</button>
      <span id="w-vres"></span>
    </div>
    <div id="w-msg" class="msg muted"></div>
    <div class="row">
      <div><label class="fl">ヘッダー</label><div class="out" id="w-head"></div></div>
      <div><label class="fl">ペイロード</label><div class="out" id="w-pay"></div></div>
    </div>
    <div id="w-claims"></div>`,
  init(){
    const inp=$('#w-in'),msg=$('#w-msg'),head=$('#w-head'),pay=$('#w-pay'),claims=$('#w-claims');
    inp.value=LS.get('jwt:in','');
    const human=(ts)=>{ const d=new Date(ts*1000); const now=Date.now()/1000; const diff=ts-now;
      const rel=Math.abs(diff)<86400*2? relTime(diff): d.toLocaleString();
      return `${d.toLocaleString()}  (${diff>=0?'あと':''}${rel})`; };
    const run=()=>{ LS.set('jwt:in',inp.value); $('#w-vres').innerHTML=''; claims.innerHTML='';
      const tok=inp.value.trim(); if(!tok){msg.textContent='';head.textContent='';pay.textContent='';return;}
      const parts=tok.split('.');
      if(parts.length!==3){ msg.className='msg err'; msg.textContent='✗ JWT は 3 つのセグメント (header.payload.signature) が必要です';
        head.textContent='';pay.textContent='';return; }
      let h,p;
      try{ h=JSON.parse(b64urlDecode(parts[0])); p=JSON.parse(b64urlDecode(parts[1])); }
      catch(e){ msg.className='msg err'; msg.textContent='✗ デコード失敗: '+e.message; return; }
      msg.className='msg ok'; msg.textContent=`✓ デコード成功 · alg=${h.alg||'?'} · typ=${h.typ||'?'}`;
      head.textContent=JSON.stringify(h,null,2); pay.textContent=JSON.stringify(p,null,2);
      const rows=[];
      const map={iss:'発行者',sub:'主体',aud:'対象',exp:'有効期限',nbf:'有効開始',iat:'発行時刻',jti:'JWT ID'};
      for(const k of ['iss','sub','aud','exp','nbf','iat','jti']) if(k in p){
        let val=p[k]; if(['exp','nbf','iat'].includes(k)) val=human(p[k]);
        let extra=''; if(k==='exp') extra = p.exp*1000<Date.now()? '<span class="pill b">期限切れ</span>':'<span class="pill g">有効</span>';
        rows.push(`<tr><td><span class="k">${k}</span></td><td>${map[k]}</td><td>${esc(String(val))} ${extra}</td></tr>`); }
      if(rows.length) claims.innerHTML=`<table><thead><tr><th>claim</th><th>意味</th><th>値</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
    };
    inp.addEventListener('input',run);
    $('#w-verify').onclick=async()=>{ const tok=inp.value.trim().split('.'); const secret=$('#w-secret').value;
      const res=$('#w-vres');
      if(tok.length!==3){ res.innerHTML='<span class="pill b">トークン不正</span>'; return; }

function diffLines(aStr,bStr){ const A=aStr.split('\n'),B=bStr.split('\n'),n=A.length,m=B.length;
  // guard huge inputs
  if(n*m>4000000) return A.map(v=>({t:'-',v})).concat(B.map(v=>({t:'+',v})));
  const dp=Array.from({length:n+1},()=>new Int32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<n&&j<m){ if(A[i]===B[j]){out.push({t:' ',v:A[i]});i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){out.push({t:'-',v:A[i]});i++;}
    else {out.push({t:'+',v:B[j]});j++;} }
  while(i<n)out.push({t:'-',v:A[i++]}); while(j<m)out.push({t:'+',v:B[j++]});
  return out; }

function parseField(f,lo,hi,name){ const set=new Set();
  for(const part of f.split(',')){ let range=part,step=1;
    if(part.includes('/')){ const [r,s]=part.split('/'); range=r; step=parseInt(s,10);
      if(!(step>=1)) throw new Error(`${name}: ステップ "${s}" が不正`); }
    let s,e;
    if(range==='*'){ s=lo;e=hi; }
    else if(range.includes('-')){ const [x,y]=range.split('-'); s=+x;e=+y; }
    else { s=e=+range; }
    if(!Number.isInteger(s)||!Number.isInteger(e)) throw new Error(`${name}: "${part}" が不正`);
    if(s<lo||e>hi||s>e) throw new Error(`${name}: "${part}" は範囲 ${lo}-${hi} 外`);
    for(let v=s;v<=e;v+=step) set.add(v);
  } return set; }
function parseCron(expr){ const p=expr.split(/\s+/);
  if(p.length!==5) throw new Error(`5フィールド必要です（${p.length}個でした）`);
  const min=parseField(p[0],0,59,'分'),hr=parseField(p[1],0,23,'時'),
        dom=parseField(p[2],1,31,'日'),mon=parseField(p[3],1,12,'月'),
        dowR=parseField(p[4],0,7,'曜日'); const dow=new Set([...dowR].map(d=>d===7?0:d));
  return {min,hr,dom,mon,dow,domStar:p[2]==='*',dowStar:p[4]==='*',raw:p}; }
function nextCronRuns(c,from,count){ const res=[]; const d=new Date(from.getTime()); d.setSeconds(0,0); d.setMinutes(d.getMinutes()+1);
  let guard=0; const MAX=527040; // ~366 days of minutes
  while(res.length<count && guard++<MAX){
    if(c.mon.has(d.getMonth()+1) && c.hr.has(d.getHours()) && c.min.has(d.getMinutes())){
      const dom=c.dom.has(d.getDate()), dow=c.dow.has(d.getDay());
      let dayOK; if(c.domStar&&c.dowStar) dayOK=true; else if(c.domStar) dayOK=dow; else if(c.dowStar) dayOK=dom; else dayOK=dom||dow;
      if(dayOK) res.push(new Date(d));
    } d.setMinutes(d.getMinutes()+1);
  } return res; }
function describeCron(c){ const N=['日','月','火','水','木','金','土'];
  const fld=(set,star,total,unit,fmt)=>{ if(star) return '毎'+unit;
    const a=[...set]; if(a.length===total) return '毎'+unit;
    return a.map(fmt||(x=>x)).join('・')+unit; };
  const minS = c.raw[0]==='*'?'毎分': (c.min.size===60?'毎分': [...c.min].join('・')+'分');
  const hrS  = c.raw[1]==='*'?'': [...c.hr].join('・')+'時';
  const dowS = c.dowStar?'': [...c.dow].map(d=>N[d]).join('・')+'曜';
  const domS = c.domStar?'': [...c.dom].join('・')+'日';
  const monS = c.raw[3]==='*'?'': [...c.mon].join('・')+'月';
  let when=[monS,domS,dowS,hrS,minS].filter(Boolean).join(' ');
  return when + ' に実行';
}

  $$('.nav-i').forEach(n=>n.classList.toggle('on',n.dataset.id===id));
  $$('.panel').forEach(p=>p.classList.toggle('on',p.id==='panel-'+id));
  $('#h-title').textContent=t.name; $('#h-desc').textContent=t.desc;
  if(!inited.has(id)){ try{ t.init(); }catch(e){ console.error(e); } inited.add(id); }
}

/* ---------- command palette ---------- */
const pal=$('#pal'),palIn=$('#pal-in'),palList=$('#pal-list'); let palSel=0,palItems=[];
function openPal(){ pal.classList.add('on'); palIn.value=''; renderPal(''); palIn.focus(); }
function closePal(){ pal.classList.remove('on'); }
function renderPal(q){ q=q.toLowerCase();
  const acts=[ ...TOOLS.map(t=>({icon:t.icon,nm:t.name,sub:t.desc,kw:t.keywords,run:()=>show(t.id)})),
    {icon:'🆔',nm:'UUID を生成してコピー',sub:'hash',kw:'uuid guid',run:()=>{show('hash');setTimeout(()=>$('#h-uuid').click(),30);}},
    {icon:'◷',nm:'現在の UNIX 時刻',sub:'time',kw:'now epoch time 現在',run:()=>{show('time');setTimeout(()=>$('#t-now').click(),30);}},
  ];
  palItems=acts.filter(a=>!q|| (a.nm+a.sub+(a.kw||'')).toLowerCase().includes(q));
  palSel=0;
  palList.innerHTML=palItems.map((a,i)=>`<div class="pi ${i===0?'sel':''}" data-i="${i}"><span class="ic">${a.icon}</span><span class="nm">${esc(a.nm)}</span><span class="sub">${esc(a.sub)}</span></div>`).join('')
    || '<div class="pi" style="color:var(--dim)">該当なし</div>';
  $$('.pi',palList).forEach(p=>{ p.onmouseenter=()=>{palSel=+p.dataset.i;hi();}; p.onclick=()=>{ const a=palItems[+p.dataset.i]; if(a){closePal();a.run();} }; });
}
function hi(){ $$('.pi',palList).forEach((p,i)=>p.classList.toggle('sel',i===palSel)); }
palIn.addEventListener('input',e=>renderPal(e.target.value));
palIn.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palItems.length-1);hi();$$('.pi',palList)[palSel]?.scrollIntoView({block:'nearest'});}
  else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);hi();}
  else if(e.key==='Enter'){ const a=palItems[palSel]; if(a){closePal();a.run();} }
  else if(e.key==='Escape'){ closePal(); }
});
pal.addEventListener('click',e=>{ if(e.target===pal) closePal(); });
$('#seek').onclick=openPal;

/* ---------- global keys ---------- */
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); pal.classList.contains('on')?closePal():openPal(); return; }
  if((e.metaKey||e.ctrlKey)&&/^[1-9]$/.test(e.key)){ const t=TOOLS[+e.key-1]; if(t){e.preventDefault();show(t.id);} }
  if(e.key==='Escape') closePal();
});

show(LS.get('active','json'));
</script>
